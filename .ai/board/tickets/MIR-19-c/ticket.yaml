mir_detail: |
  ADR-097 decision 5, items 1 (the rest) to 6, in this order. MIR-19 serves `/{own_org}/…` beside every
  root address (`getOwnOrgCode()`, `useSession().orgCode`, `src/lib/org-path.ts`). MIR-19-b added
  `tests/e2e/support/org-prefix.ts` (`E2E_ORG_CODE`, `stripOrg`, `appPathname`, `appHref`), moved the
  nine href-asserting specs onto it, and listed them in `MIGRATED_SPECS` in `tests/e2e-org-prefix.test.ts`
  (append, never remove).
  1. The specs that walk history to an exact pathname learn the prefix through `appPathname`, while
     the root addresses still serve. Counted at /plan MIR-19-b: adm-05 (:98), cal-03 (:86), cal-04 (:71),
     cal-05 (:83, :103), cal-06 (:108, :141), cal-07 (:115), cal-08 (:147, :150), cal-10 (:69, :91),
     evt-09 (:197), solo-pending-approval-ui (:84), uie-07 (:105, :130). Check each walk's caller: a
     pending (`undecided`) or member-less caller stays at the root after the flip.
     NOT edited (member-less stays at the root): adm-04:374, uie-09:321.
  2. The flip: `/`, signing in, signing up and every org-less app address send a member to
     `/{org_code}` + the same path and query. `undecided` and `member-less` stay at the root. The flip
     owns the specs whose subject is the landing itself: evt-14-guest-sign-in's exact `toHaveURL`
     strings (:289-358), and mir-19-org-routing.spec.ts AC-11 (root addresses not redirected).
  3. Email links carry the org (`supabase/functions/send-event-email/template.ts:269`). Guest links
     stay token-only (ADR-097 decision 6).
  4. nginx drops `$uri/` from `location /` (`docker/nginx.conf`).
  5. The system panel's mock reserved list gains `tasks` (`src/lib/data/system.ts:758`).
  6. A sign-up at `/{org_code}/signup` lands in that org (ADR-071 decision 1) — schema change, own ADR.
