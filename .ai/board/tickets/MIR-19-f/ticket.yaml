mir_detail: |
  ADR-097 decision 5, item 6: a sign-up at /{org_code}/signup lands in that org (ADR-071 decision 1).
  Today /{org}/signup crosses out to /signup (MIR-19 AC-9, App.tsx LeaveOrg kind "through"), and every
  sign-up creates a pending member row with no team (admit_allow_listed_member, SOLO
  2026-09-10). This needs a sign-up write path that takes an org: a schema change and its own ADR,
  written at this ticket's PLAN (ADR-008, ADR-067). Applying the migration to the hosted project is
  human (RULE-09). Open at PLAN: which orgs accept sign-ups at their address, and what a sign-up at an
  unknown or reserved code does; both come from ADR-071 and the operator's recorded decisions, never
  invented.
