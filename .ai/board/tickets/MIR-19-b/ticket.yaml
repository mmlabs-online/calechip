mir_detail: |
  ADR-097 decision 5, in this order. MIR-19 already serves `/{own_org}/…` beside every root address,
  shows a not-found screen at any other org's address, and reads the caller's org through
  `getOwnOrgCode()` (`useSession().orgCode`). `src/lib/org-path.ts` holds `splitOrgPath` / `orgPath`.
  1. The e2e specs learn the org prefix through one helper under `tests/e2e/support/`, while the root
     addresses still serve, so each passes before and after the flip. Sites, counted at /plan MIR-19:
     `toHaveURL` with an exact string or `/\/$/` (evt-14, adm-04, uie-09); `toHaveAttribute("href", "/…")`
     (solo-admin-back-to-calendar, solo-approval-settings, solo-profile, solo-team-settings,
     solo-teams, tsk-01, tsk-04, uie-09); history walks on `new URL(page.url()).pathname`
     (adm-05, cal-03, cal-04, cal-05, cal-06, cal-07, cal-08, cal-10, evt-09, solo-pending-approval-ui).
  2. The flip: `/`, signing in, signing up and every org-less app address send a member to
     `/{org_code}` + the same path and query. `undecided` and `member-less` stay at the root.
  3. Email links carry the org (`supabase/functions/send-event-email/template.ts:269`). Guest links
     stay token-only (ADR-097 decision 6).
  4. nginx drops `$uri/` from `location /` (`docker/nginx.conf`).
  5. The system panel's mock reserved list gains `tasks` (`src/lib/data/system.ts:758`).
  6. A sign-up at `/{org_code}/signup` lands in that org (ADR-071 decision 1) — schema change, own ADR.
