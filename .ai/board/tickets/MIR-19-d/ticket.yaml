mir_detail: |
  ADR-097 decision 5, items 2 to 6, in this order. MIR-19 serves `/{own_org}/…` beside every root
  address (`getOwnOrgCode()`, `useSession().orgCode`, `src/lib/org-path.ts`). MIR-19-b added
  `tests/e2e/support/org-prefix.ts` and moved the nine href-asserting specs onto it. MIR-19-c moved the
  ten history-walk specs onto `appPathname` (`MIGRATED_SPECS` and `WALK_SPECS` in
  `tests/e2e-org-prefix.test.ts`; append, never remove).
  2. The flip: `/`, signing in, signing up and every org-less app address send a member to
     `/{org_code}` + the same path and query. `undecided` and `member-less` stay at the root. The flip
     owns the specs whose subject is the landing itself: evt-14-guest-sign-in's exact `toHaveURL`
     strings (:289-358), and mir-19-org-routing.spec.ts AC-11 (root addresses not redirected).
     Found at /plan MIR-19-c, to count at this PLAN: eleven specs navigate by
     `window.history.pushState` + `popstate` to an org-less address (evt-03, evt-06, evt-07, evt-09,
     evt-10, evt-11, evt-14, solo-approval-settings, solo-busy-day, tsk-02, uie-12). After the flip a
     member's router basename is `/shared`, so whether those pushes still reach their screen depends
     on how the flip treats an org-less address reached by popstate (ADR-097 decision 1). evt-09:197
     is the exception: it pushes the page's own raw pathname back, which is correct at either address.
  3. Email links carry the org (`supabase/functions/send-event-email/template.ts:269`). Guest links
     stay token-only (ADR-097 decision 6).
  4. nginx drops `$uri/` from `location /` (`docker/nginx.conf`).
  5. The system panel's mock reserved list gains `tasks` (`src/lib/data/system.ts:758`).
  6. A sign-up at `/{org_code}/signup` lands in that org (ADR-071 decision 1) — schema change, own ADR.
