mir_detail: |
  ADR-097 decision 5, items 3 to 5, in this order. MIR-19-d shipped the flip: an approved member at any
  org-less app address is sent to /{org_code} + the same path (src/App.tsx EnterOwnOrg and the capture
  popstate listener; ownOrgAddress in src/lib/org-path.ts).
  3. Email links carry the org (supabase/functions/send-event-email/template.ts:269). Guest links stay
     token-only (ADR-097 decision 6). Until this ships an emailed /events/<id> still works for a member,
     because the flip carries them on to /shared/events/<id>. PLAN decides where the function reads the
     event's org_code from.
  4. nginx drops $uri/ from location / (docker/nginx.conf:79, try_files $uri $uri/ /index.html).
  5. The system panel's mock reserved list gains "tasks" (src/lib/data/system.ts, MOCK_RESERVED_ORG_CODES;
     the constraint has it since 20261111150000_mir19_own_org_code.sql, and src/lib/org-path.ts has it).
