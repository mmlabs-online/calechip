mir_detail: |
  The last bullet of P4-2, "Router has no role guards at all; add them" (plan:244), per ADR-094
  decision 3:
  - `src/App.tsx`: every admin route sits under `AdminLayout` and is guarded on `member`; each
    screen (AdminHub, NewSignups, Threshold, Teams, TeamEntries, Holidays, IssueReports) refuses a
    non-admin in place through `mayAdminister` (MIR-17-b), "because the refusal is what says why"
    (the `/admin` and `/reports` route comments).
  - Decide between intercepting at the route and keeping the in-place refusals (ADR-089 Context).
    Interception moves the e2e refusal assertions that address each screen's `*-refused` element.
  - `/members` is not admin-only (TEA-04 AC-3) and must not gain an admin guard.
